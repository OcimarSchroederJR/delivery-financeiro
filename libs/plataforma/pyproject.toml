[project]
name = "plataforma"
version = "0.1.0"
description = "Código técnico transversal da Equipe 5 (sem domínio)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "faststream[rabbit]>=0.7.7,<0.8",
    "aio-pika>=10.1,<11",
    "httpx>=0.28,<1",
    "tenacity>=9.2,<10",
    "structlog>=26.1,<27",
    "pyjwt[crypto]>=2.15,<3",
    "cryptography>=50",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
