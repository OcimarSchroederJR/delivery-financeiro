# Ambiente local da Equipe 5.
#   docker compose up -d --build                  # serviços + infraestrutura
#   docker compose --profile mocks up -d --build  # + mocks das Equipes 1, 3 e 4
# Cada serviço declara seus containers no próprio compose.yaml (incluído abaixo).
name: financeiro-eq5

include:
  - path: services/pagamentos/compose.yaml
  - path: services/notificacoes/compose.yaml
  - path: services/avaliacoes/compose.yaml
  - path: mocks/compose.yaml

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - dados-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  dados-rabbitmq:
