[project]
name = "mocks-equipes"
version = "0.1.0"
description = "Mocks das Equipes 1, 3 e 4 para desenvolvimento, testes e demonstração."
requires-python = ">=3.12,<3.13"
dependencies = [
    "plataforma",
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.15,<3",
    "cryptography>=50",
]

[tool.uv.sources]
plataforma = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
