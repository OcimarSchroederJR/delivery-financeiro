[project]
name = "delivery-financeiro"
version = "0.1.0"
description = "Equipe 5 (Financeiro e Pós): Pagamentos, Notificações e Avaliações."
requires-python = ">=3.12,<3.13"
dependencies = ["plataforma", "pagamentos", "mocks-equipes"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "testcontainers[postgres,rabbitmq]>=4.15,<5",
    "respx>=0.23,<1",
    "asgi-lifespan>=2.1,<3",
    "schemathesis>=4.31,<5",
    "mypy>=2.4,<3",
    "ruff>=0.17,<0.18",
    "pre-commit>=4.7,<5",
]

[tool.uv]
package = false
required-version = ">=0.11.14,<0.12"

[tool.uv.workspace]
members = ["libs/plataforma", "services/pagamentos", "mocks"]

[tool.uv.sources]
plataforma = { workspace = true }
pagamentos = { workspace = true }
mocks-equipes = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF", "PT", "DTZ", "C4", "N"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["plataforma", "pagamentos", "notificacoes", "avaliacoes", "mocks_equipes"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["integracao: exige Docker (testcontainers)"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
