version: "3.9"

services:
  notificacoes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-notificacoes_db}
      POSTGRES_USER: ${DB_USER:-notificacoes_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notificacoes_pass}
    ports:
      - "5452:5432"
    volumes:
      - notificacoes-db-data:/var/lib/postgresql/data

  notificacoes:
    build: .
    ports:
      - "${PORT:-8052}:8052"
    environment:
      PORT: ${PORT:-8052}
      DB_HOST: notificacoes-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-notificacoes_db}
      DB_USER: ${DB_USER:-notificacoes_user}
      DB_PASSWORD: ${DB_PASSWORD:-notificacoes_pass}
      IDENTIDADE_SERVICE_URL: ${IDENTIDADE_SERVICE_URL:-http://localhost:8011}
      CHECKOUT_SERVICE_URL: ${CHECKOUT_SERVICE_URL:-http://localhost:8031}
    depends_on:
      - notificacoes-db

volumes:
  notificacoes-db-data:
