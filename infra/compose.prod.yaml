# Produção da Equipe 5 (spec §7.3). Na VM, este arquivo fica ao lado do Caddyfile e do .env:
#   TAG=<sha> docker compose -f compose.prod.yaml pull
#   TAG=<sha> docker compose -f compose.prod.yaml up -d
# Só o Caddy publica portas; APIs, bancos e RabbitMQ ficam na rede interna.
# Variáveis com ${VAR:?} são obrigatórias: o compose não sobe sem elas.
name: financeiro-eq5

# Ambiente comum às APIs, workers e migrações dos 3 serviços.
x-ambiente-comum: &ambiente-comum
  AMBIENTE: producao
  LOG_FORMATO: json
  LOG_NIVEL: ${LOG_NIVEL:-INFO}
  RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:?defina RABBITMQ_USUARIO no .env}:${RABBITMQ_SENHA:?defina RABBITMQ_SENHA no .env}@rabbitmq:5672/
  JWKS_URL: ${JWKS_URL:?defina JWKS_URL no .env (JWKS da Equipe 1)}
  TOKEN_SERVICO_SEGREDO: ${TOKEN_SERVICO_SEGREDO:?defina TOKEN_SERVICO_SEGREDO no .env}
  OTEL_HABILITADO: ${OTEL_HABILITADO:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-imagem-pagamentos: &imagem-pagamentos
  image: ghcr.io/ocimarschroederjr/pagamentos:${TAG:?defina TAG (tag das imagens no GHCR)}

x-ambiente-pagamentos: &ambiente-pagamentos
  <<: *ambiente-comum
  ROOT_PATH: /pagamentos
  DATABASE_URL: postgresql+asyncpg://pagamentos:${PAGAMENTOS_DB_SENHA:?defina PAGAMENTOS_DB_SENHA no .env}@db-pagamentos:5432/pagamentos
  PEDIDOS_URL: ${PEDIDOS_URL:?defina PEDIDOS_URL no .env (API da Equipe 3)}

x-imagem-notificacoes: &imagem-notificacoes
  image: ghcr.io/ocimarschroederjr/notificacoes:${TAG:?defina TAG (tag das imagens no GHCR)}

x-ambiente-notificacoes: &ambiente-notificacoes
  <<: *ambiente-comum
  ROOT_PATH: /notificacoes
  DATABASE_URL: postgresql+asyncpg://notificacoes:${NOTIFICACOES_DB_SENHA:?defina NOTIFICACOES_DB_SENHA no .env}@db-notificacoes:5432/notificacoes

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:?defina RABBITMQ_USUARIO no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_SENHA:?defina RABBITMQ_SENHA no .env}
    volumes:
      - dados-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Caixa de e-mail da demo. A interface fica em /mailpit (atrás de basic auth no Caddy).
  mailpit:
    image: axllent/mailpit:v1.31.5
    environment:
      MP_WEBROOT: mailpit
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # Traces. A interface fica em /jaeger (atrás de basic auth no Caddy); os serviços
  # enviam OTLP para jaeger:4318 pela rede interna.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: ["--set=extensions.jaeger_query.base_path=/jaeger"]
    restart: unless-stopped

  db-pagamentos:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pagamentos
      POSTGRES_PASSWORD: ${PAGAMENTOS_DB_SENHA:?defina PAGAMENTOS_DB_SENHA no .env}
      POSTGRES_DB: pagamentos
    volumes:
      - dados-pagamentos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamentos -d pagamentos"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate-pagamentos:
    <<: *imagem-pagamentos
    command: ["alembic", "upgrade", "head"]
    environment: *ambiente-pagamentos
    healthcheck:
      disable: true
    depends_on:
      db-pagamentos:
        condition: service_healthy
    restart: "no"

  pagamentos:
    <<: *imagem-pagamentos
    environment: *ambiente-pagamentos
    depends_on:
      migrate-pagamentos:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  pagamentos-worker:
    <<: *imagem-pagamentos
    command: ["pagamentos-worker"]
    environment: *ambiente-pagamentos
    healthcheck:
      disable: true
    depends_on:
      migrate-pagamentos:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db-notificacoes:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notificacoes
      POSTGRES_PASSWORD: ${NOTIFICACOES_DB_SENHA:?defina NOTIFICACOES_DB_SENHA no .env}
      POSTGRES_DB: notificacoes
    volumes:
      - dados-notificacoes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificacoes -d notificacoes"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate-notificacoes:
    <<: *imagem-notificacoes
    command: ["alembic", "upgrade", "head"]
    environment: *ambiente-notificacoes
    healthcheck:
      disable: true
    depends_on:
      db-notificacoes:
        condition: service_healthy
    restart: "no"

volumes:
  dados-rabbitmq:
  dados-pagamentos:
  dados-notificacoes:
