name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.14"
  PYTHON_VERSION: "3.12"

jobs:
  componente:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: plataforma
            caminho: libs/plataforma
            pacote: plataforma
            contratos: false
            dockerfile: ""
          - nome: pagamentos
            caminho: services/pagamentos
            pacote: pagamentos
            contratos: true
            dockerfile: services/pagamentos/Dockerfile
          - nome: notificacoes
            caminho: services/notificacoes
            pacote: notificacoes
            contratos: true
            dockerfile: services/notificacoes/Dockerfile
          - nome: avaliacoes
            caminho: services/avaliacoes
            pacote: avaliacoes
            contratos: true
            dockerfile: services/avaliacoes/Dockerfile
          - nome: mocks
            caminho: mocks
            pacote: mocks_equipes
            contratos: false
            dockerfile: mocks/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check ${{ matrix.caminho }}

      - name: Ruff (formatação)
        run: uv run ruff format --check ${{ matrix.caminho }}

      - name: mypy --strict
        run: uv run mypy ${{ matrix.caminho }}/src

      - name: Testes (unitários, integração e API) com cobertura
        run: >-
          uv run pytest ${{ matrix.caminho }}/tests
          --cov=${{ matrix.pacote }}
          --cov-report=term-missing
          --cov-fail-under=75

      - name: Contratos OpenAPI/AsyncAPI sem drift
        if: matrix.contratos
        run: uv run python -m ${{ matrix.pacote }}.contratos --verificar

      - uses: docker/setup-buildx-action@v4
        if: matrix.dockerfile != ''

      - name: Docker build
        if: matrix.dockerfile != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  compose:
    name: compose (validação)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validar compose.yaml (com e sem mocks)
        run: |
          docker compose config --quiet
          docker compose --profile mocks config --quiet
      - name: Validar compose de produção (com e sem mocks e com o override local)
        run: |
          prod="docker compose -f infra/compose.prod.yaml --env-file infra/.env.local.example"
          $prod config --quiet
          $prod --profile mocks config --quiet
          $prod -f infra/compose.prod.local.yaml --profile mocks config --quiet
      - name: Validar Caddyfile (formatação e configuração)
        # Roda pelo compose para o Caddy receber DOMINIO e BASIC_AUTH_* como em produção.
        run: |
          docker compose -f infra/compose.prod.yaml --env-file infra/.env.local.example \
            run --rm --no-deps -T caddy \
            sh -c 'caddy fmt /etc/caddy/Caddyfile | diff /etc/caddy/Caddyfile - && caddy validate --config /etc/caddy/Caddyfile'

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELATORIOS: e2e-relatorios
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Subir a stack com os mocks
        run: docker compose --profile mocks up -d --build

      - name: Esperar os serviços, os mocks e o Mailpit
        run: |
          for url in 8013/saude/pronto 8014/saude/pronto 8015/saude/pronto \
                     8001/saude/vivo 8008/saude/vivo 8010/saude/vivo 8025/readyz; do
            timeout 180 bash -c "until curl -fsS -o /dev/null http://localhost:$url; do sleep 2; done" \
              || { echo "localhost:$url não ficou pronto em 180 s"; exit 1; }
          done

      # A coleção roda antes do fuzzing para os webhooks criados pelo schemathesis não atrasarem o worker
      - name: Coleção Postman (Newman)
        run: >-
          npx --yes newman@6.2.1 run docs/postman/delivery-financeiro.postman_collection.json
          -e docs/postman/ci.postman_environment.json
          --reporters cli,junit --reporter-junit-export "$RELATORIOS/newman.xml"

      - name: Contratos OpenAPI (schemathesis)
        run: |
          token=$(curl -fsS -X POST localhost:8001/tokens -H 'Content-Type: application/json' \
            -d '{"sub": "admin-e2e", "papel": "admin"}' | jq -r .access_token)
          falhou=0
          for porta in 8013 8014 8015; do
            # Fora: status_code_conformance (400 de JSON malformado não está no OpenAPI),
            # positive/negative_data_rejection (regras de negócio mais rígidas que o schema),
            # unsupported_method e allow_header_conformance (405 do próprio FastAPI)
            uv run --locked --only-group dev schemathesis run "http://localhost:$porta/openapi.json" \
              -H "Authorization: Bearer $token" \
              --checks not_a_server_error,content_type_conformance,response_headers_conformance,response_schema_conformance,ignored_auth,use_after_free,ensure_resource_availability \
              --max-examples 50 --generation-deterministic \
              --report junit --report-junit-path "$RELATORIOS/schemathesis-$porta.xml" \
              || falhou=1
          done
          exit $falhou

      - name: Guardar os logs dos containers
        if: failure()
        run: |
          mkdir -p "$RELATORIOS"
          docker compose --profile mocks ps -a > "$RELATORIOS/compose-ps.txt"
          docker compose --profile mocks logs --no-color --timestamps > "$RELATORIOS/compose.log"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: ${{ env.RELATORIOS }}/
          retention-days: 7

      - name: Derrubar a stack
        if: always()
        run: docker compose --profile mocks down -v

  ci-ok:
    name: ci-ok
    if: always()
    needs: [componente, compose, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar resultado dos jobs
        run: |
          test "${{ needs.componente.result }}" = "success"
          test "${{ needs.compose.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
