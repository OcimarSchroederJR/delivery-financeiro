name: Deploy

# CD (spec §8): cada push na main publica as imagens no GHCR e atualiza a VM por SSH.
# Passo a passo e GitHub Secrets: docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um novo push espera o anterior terminar (não cancela no meio do "up").
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/ocimarschroederjr

jobs:
  imagens:
    name: imagem (${{ matrix.nome }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - nome: pagamentos
            dockerfile: services/pagamentos/Dockerfile
          - nome: notificacoes
            dockerfile: services/notificacoes/Dockerfile
          - nome: avaliacoes
            dockerfile: services/avaliacoes/Dockerfile
          - nome: mocks
            dockerfile: mocks/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (${{ github.sha }} e latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.nome }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ matrix.nome }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
